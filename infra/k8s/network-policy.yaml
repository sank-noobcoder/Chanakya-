apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solver-worker-egress-deny
  namespace: chanakya
spec:
  podSelector:
    matchLabels:
      app: solver-worker
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
  egress:
    # Workers are only allowed to connect to internal Redis and MinIO
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
    # ZERO access to external internet (prevents data exfiltration and reverse shells)
