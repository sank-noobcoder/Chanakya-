services:
  # ============================================================================
  # Layer 1 & 2: Reverse Proxy & Edge Protection (Nginx)
  # ============================================================================
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: chanakya-reverse-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - chanakya-public
      - chanakya-internal

  # ============================================================================
  # Web Console: Next.js 14 SSR
  # ============================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chanakya-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    networks:
      - chanakya-internal

  # ============================================================================
  # Backend API: FastAPI (Python 3.12)
  # ============================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chanakya-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=chanakya_app
      - POSTGRES_PASSWORD=chanakya_secure_pass_change_in_prod
      - POSTGRES_DB=chanakya_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://chanakya_app:chanakya_secure_pass_change_in_prod@postgres:5432/chanakya_db
      - REDIS_URL=redis://:chanakya_redis_pass_change_in_prod@redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin_secure_change_me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
    networks:
      - chanakya-internal

  # ============================================================================
  # Layer 7: Sandboxed Solver Worker (Rust Core)
  # ============================================================================
  solver-worker:
    build:
      context: ./solver-core
      dockerfile: Dockerfile.worker
    container_name: chanakya-worker
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=chanakya_redis_pass_change_in_prod
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin_secure_change_me
    depends_on:
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M
    security_opt:
      - no-new-privileges:true
    networks:
      - chanakya-internal

  # ============================================================================
  # Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: chanakya-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=chanakya_app
      - POSTGRES_PASSWORD=chanakya_secure_pass_change_in_prod
      - POSTGRES_DB=chanakya_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanakya_app -d chanakya_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chanakya-internal

  # ============================================================================
  # Queue & Cache: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: chanakya-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "chanakya_redis_pass_change_in_prod"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "chanakya_redis_pass_change_in_prod", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chanakya-internal

  # ============================================================================
  # Object Storage: MinIO
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: chanakya-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_secure_change_me
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    networks:
      - chanakya-internal

networks:
  chanakya-public:
    driver: bridge
  chanakya-internal:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  redis-data:
  minio-data:
