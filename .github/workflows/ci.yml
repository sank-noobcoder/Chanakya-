name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  solver-core:
    name: Rust Solver Core Tests & Banned Crates Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solver-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Enforce Zero Foreign Solver Dependency (cargo-deny)
        run: |
          cargo install --locked cargo-deny || true
          cd solver-core && cargo deny check bans
      
      - name: Format & Lint
        run: |
          cd solver-core
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      
      - name: Run Solver Unit & Verification Tests
        run: |
          cd solver-core
          cargo test --workspace --verbose

  backend:
    name: Backend API & 7-Layer Security Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chanakya_app
          POSTGRES_PASSWORD: chanakya_secure_pass_change_in_prod
          POSTGRES_DB: chanakya_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint & Typecheck
        run: |
          cd server
          ruff check .
          mypy app

      - name: Run Backend Unit & Integration Tests
        run: |
          cd server
          pytest -v tests/test_api.py

      - name: Run Security Test Matrix Gate
        run: |
          cd server
          pytest -v tests/test_security_matrix.py

  frontend:
    name: Frontend Build & Typecheck (Next.js SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package.json

      - name: Install dependencies & Build
        run: |
          cd client
          npm ci
          npm run lint
          npm run build
